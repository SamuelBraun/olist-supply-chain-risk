[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist"
version = "0.1.0"
description = "Olist Supply Chain Risk Intelligence — NOVA IMS Big Data Analysis group project"
requires-python = ">=3.9,<3.11"
dependencies = [
    "pyspark>=3.3,<3.6",
    "findspark>=2.0",
    "torch>=1.13",
    "pandas>=1.5,<2.3",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
